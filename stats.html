<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>CheckGames · Stats</title>
  <style>
    :root { --bg: #f5f3ee; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a65; --accent: #1f7a4d; --bad: #b3261e; --line: #e4e1d8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141412; --card: #1f1f1c; --text: #f0eee8; --muted: #a09e96; --accent: #4cc38a; --bad: #f2867d; --line: #2e2d29; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: .9rem; margin: 0 0 20px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .dot.off { background: var(--bad); }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    .tile b { display: block; font-size: 2.2rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .tile span { color: var(--muted); font-size: .9rem; }
    footer { margin-top: 20px; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>CheckGames · statistiques</h1>
    <p class="sub"><span id="dot" class="dot"></span><span id="status">Chargement…</span></p>
    <div class="grid">
      <div class="tile"><b id="connected">–</b><span>joueurs connectés</span></div>
      <div class="tile"><b id="rooms">–</b><span>parties ouvertes</span></div>
      <div class="tile"><b id="playing">–</b><span>manches en cours</span></div>
      <div class="tile"><b id="players">–</b><span>joueurs inscrits (absents compris)</span></div>
    </div>
    <footer id="uptime"></footer>
  </main>
  <script src="/stats.js"></script>
</body>
</html>
